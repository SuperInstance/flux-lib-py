[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-lib"
version = "0.1.0"
description = "Constraint theory as a single import: from flux_lib import ConstraintEngine"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Casey Digennaro", email = "casey@superinstance.com"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
